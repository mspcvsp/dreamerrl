name: GPU Tests

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  gpu-tests:
    runs-on: [self-hosted, gpu, linux, ARM64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.9"
      - name: Install maintained locked uv environment
        run: bash scripts/setup_uv.sh
      - name: Real GPU forward and backward check
        env:
          CUDA_VISIBLE_DEVICES: "0"
          CUBLAS_WORKSPACE_CONFIG: ":4096:8"
        run: uv run --locked python scripts/verify_uv.py --gpu
      - name: CPU/GPU actor invariant
        run: uv run --locked pytest -q dreamerrl/tests/invariants/test_actor_cpu_gpu_determinism.py
