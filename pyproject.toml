[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dreamerrl"
version = "0.1.1"
description = "DreamerV3 implementation with diagnostics"
authors = [{ name = "Sean" }]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "torch>=2.0",
    "numpy>=1.23",
    "gymnasium>=1.1",
    "popgym>=0.1.0",
    "matplotlib>=3.7",
    "tqdm>=4.65",
    "tyro>=0.5",
    "tensorboard>=2.14",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "black>=24.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dreamerrl*"]
exclude = ["tests*"]


# -----------------------------
# Ruff configuration
# -----------------------------
[tool.ruff]
extend-exclude = ["runs", "environments/cage2/vendor"]
force-exclude = true
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
extend-select = ["I"]
ignore = ["E203"]  # black compatibility

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["F401"]

# -----------------------------
# Black configuration
# -----------------------------
[tool.black]
line-length = 120
target-version = ["py310"]

# -----------------------------
# Pytest configuration
# -----------------------------
[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "gates: LSTM gate-level invariants",
    "drift: Drift, saturation, and long-horizon stability invariants",
    "policy: Policy-level invariants",
    "ppo: PPO algorithm invariants",
    "infra: Infrastructure and buffer invariants",
]

# -----------------------------
# Mypy configuration
# -----------------------------
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict = false

# Root development/regression environment. The historical CAGE2 project retains
# its separate unchanged lockfile under environments/cage2/.
[dependency-groups]
tools = [
    "pytest==9.2.0",
    "pytest-env==1.5.0",
    "ruff==0.14.14",
    "mypy==1.19.1",
    "pyright[nodejs]==1.1.414",
    "black==26.1.0",
    "cyborg==2.1",
    "nvidia-cusparselt-cu13==0.8.0+spark1; sys_platform == 'linux' and platform_machine == 'aarch64'",
]
dev = [{ include-group = "tools" }, "gymnasium==1.4.0", "setuptools==84.2.1"]
legacy = [
    { include-group = "tools" },
    "gymnasium==1.2.0", "setuptools==80.9.0", "minihack==1.0.2", "nle==1.3.0", "minigrid==3.1.0",
]

[tool.uv]
required-version = "==0.13.9"
python-preference = "only-managed"
default-groups = ["dev"]
conflicts = [[{ group = "dev" }, { group = "legacy" }]]
constraint-dependencies = ["torch==2.9.1", "numpy==1.26.4", "grpcio==1.85.3", "packaging==26.3"]
build-constraint-dependencies = ["setuptools==80.9.0", "wheel==0.45.1"]
environments = [
    "sys_platform == 'linux' and platform_machine == 'aarch64' and python_version == '3.10'",
    "sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.10'",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
cyborg = { path = "environments/cage2/vendor/cage-challenge-2/CybORG", editable = true }
nvidia-cusparselt-cu13 = { path = "environments/cage2/wheels/nvidia_cusparselt_cu13-0.8.0+spark1-py3-none-manylinux2014_aarch64.whl" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
